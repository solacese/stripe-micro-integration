apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stripe-solace-bridge.fullname" . | default "stripe-solace-bridge" }}
  labels:
    app.kubernetes.io/name: stripe-solace-bridge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: stripe-solace-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stripe-solace-bridge
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: APP_PORT
              value: "{{ .Values.service.port }}"
            - name: SOLACE_HOST
              value: "{{ .Values.config.solace.host }}"
            - name: SOLACE_VPN
              value: "{{ .Values.config.solace.vpn }}"
            - name: SOLACE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.solace.usernameRef }}
                  key: value
            - name: SOLACE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.solace.passwordRef }}
                  key: value
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.stripe.webhookSecretRef }}
                  key: value
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.stripe.apiKeyRef }}
                  key: value
            - name: REDIS_URL
              value: "redis://{{ .Values.config.redis.host }}:6379/0"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
