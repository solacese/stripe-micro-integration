[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "integration: integration tests requiring running dependencies",
  "e2e: end-to-end tests requiring Stripe + Solace connectivity",
]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "stripe.*",
  "solace.*",
  "redis.*",
  "structlog.*",
  "prometheus_client.*",
  "requests.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
